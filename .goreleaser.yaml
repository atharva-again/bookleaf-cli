# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: bookleaf

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X bookleaf-cli/cmd.rootVersion={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    wrap_in_directory: true
    files:
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  groups:
    - title: "Features"
      regexp: "^feat"
      order: 0
    - title: "Bug fixes"
      regexp: "^fix"
      order: 1
    - title: "Maintenance"
      regexp: "^(chore|ci|docs|test|refactor)"
      order: 2
    - title: "Other changes"
      order: 999
  filters:
    exclude:
      - "^docs"
      - "^test"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

sboms:
  - artifacts: archive

release:
  github:
    owner: atharva-again
    name: bookleaf-cli
  prerelease: auto
  header: |
    ## BookLeaf CLI v{{ .Version }}

    ### macOS / Linux
    ```sh
    curl -fsSL https://bookleaf-assignment-atharva.vercel.app/cli/install.sh | bash
    ```

    ### Windows
    ```powershell
    irm https://bookleaf-assignment-atharva.vercel.app/cli/install.ps1 | iex
    ```

    Checksums signed with cosign (keyless). Verify:

    ```sh
    cosign verify-blob --bundle checksums.txt.sigstore.json checksums.txt
    ```
